name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Validate Digital DNA & Build Legacy Bridge
        env:
          VITE_BASE_PATH: '/visuals/'
          SITE_ORIGIN: 'https://ahmedissamramadan.github.io/visuals'
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          node scripts/dna-check.mjs
          npm run build
          node --input-type=commonjs -e '
            const fs = require("fs"), path = require("path");
            const redir = "<script>(function(){var p=location.pathname.replace(/^\\/visuals/,\"\")||\"/\";var m={\"/case-studies\":\"/proof\",\"/case-studies/\":\"/proof/\",\"/game\":\"/lab\",\"/game/\":\"/lab/\",\"/admin\":\"/studio\",\"/admin/\":\"/studio/\"};location.replace(\"https://ahmedissamramadan.github.io\"+(m[p]||p)+location.search+location.hash);})();</script>";
            function patch(d){for(const f of fs.readdirSync(d)){const full=path.join(d,f);if(fs.statSync(full).isDirectory())patch(full);else if(f.endsWith(".html"))fs.writeFileSync(full,fs.readFileSync(full,"utf8").replace("<head>","<head>"+redir));}}
            patch("dist");
          '
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
